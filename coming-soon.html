<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon — APEX Volt E-Hyperbike | APEX MOTORS</title>
  <meta name="description" content="The next generation of electric hyperbike performance is launching soon. Subscribe for early access and launch countdown updates.">
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏍️</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  
  <script src="assets/js/main.js" defer></script>
</head>
<body>

  <main class="coming-soon">
    <div class="floating-shapes">
      <div class="floating-shape"></div>
      <div class="floating-shape"></div>
      <div class="floating-shape"></div>
    </div>

    <div class="coming-soon__content">
      <a href="index.html" class="navbar__logo" style="justify-content: center; margin-block-end: var(--space-6);">
        <div class="navbar__logo-icon"><i class="ri-motorbike-line"></i></div>
        <span>APEX MOTORS</span>
      </a>

      <div class="hero__badge" style="margin-inline: auto;">
        <i class="ri-flashlight-line"></i> Electric Hyperbike Reveal
      </div>

      <h1>APEX VOLT E-HYPERBIKE</h1>
      <p>0-100 km/h in 2.1 seconds. 150 HP instant torque. Zero emissions. The future of track performance arrives soon.</p>

      <!-- Live Countdown Timer -->
      <div class="countdown">
        <div class="countdown__item">
          <div class="countdown__value" data-countdown-days>30</div>
          <div class="countdown__label">Days</div>
        </div>
        <div class="countdown__item">
          <div class="countdown__value" data-countdown-hours>14</div>
          <div class="countdown__label">Hours</div>
        </div>
        <div class="countdown__item">
          <div class="countdown__value" data-countdown-minutes>42</div>
          <div class="countdown__label">Minutes</div>
        </div>
        <div class="countdown__item">
          <div class="countdown__value" data-countdown-seconds>18</div>
          <div class="countdown__label">Seconds</div>
        </div>
      </div>

      <!-- Email Capture Form -->
      <form class="coming-soon__form" data-validate="false">
        <input type="email" class="form-input" placeholder="Enter your email for VIP launch invitation" required>
        <button type="submit" class="btn btn--primary">Get Early Access</button>
      </form>

      <div class="coming-soon__social">
        <a href="#" aria-label="Instagram"><i class="ri-instagram-line"></i></a>
        <a href="#" aria-label="YouTube"><i class="ri-youtube-line"></i></a>
        <a href="#" aria-label="Facebook"><i class="ri-facebook-fill"></i></a>
        <a href="#" aria-label="Twitter X"><i class="ri-twitter-x-line"></i></a>
      </div>

      <div style="margin-block-start: var(--space-8);">
        <a href="index.html" class="btn btn--ghost" style="color: rgba(255,255,255,0.7);"><i class="ri-arrow-left-line"></i> Return to Main Showroom</a>
      </div>
    </div>
  </main>

</body>
</html>
